name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Get version number from the csproj under src/Inkukan.api ---
      - name: Extract version from csproj
        id: version
        run: |
          echo "Repo root contents:"
          ls -la

          echo "Looking for src/ folder (case-insensitive):"
          find . -maxdepth 2 -iname "src" -type d

          echo "Searching whole repo for Inkukan.api csproj:"
          CSPROJ=$(find . -iname "*.csproj" -ipath "*inkukan.api*" | head -n1)

          if [ -z "$CSPROJ" ]; then
            echo "No matching .csproj found anywhere in the repo." >&2
            echo "All .csproj files found instead:" >&2
            find . -iname "*.csproj" >&2
            exit 1
          fi

          echo "Using csproj: $CSPROJ"

          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" "$CSPROJ" || true)
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -oPm1 "(?<=<VersionPrefix>)[^<]+" "$CSPROJ" || true)
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0-${GITHUB_SHA::7}"
            echo "No <Version>/<VersionPrefix> tag found, falling back to $VERSION"
          fi

          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # --- Build the image locally on the runner (no registry) ---
      - name: Build image
        run: |
          docker build -t inkukan-api:${{ steps.version.outputs.version }} .

      - name: Save image as tarball
        run: |
          docker save -o inkukan-api.tar inkukan-api:${{ steps.version.outputs.version }}

      # --- Ship it to the VPS ---
      - name: Set up SSH key
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "SSH_HOST secret is not set" >&2
            exit 1
          fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "SSH_USER secret is not set" >&2
            exit 1
          fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "SSH_PRIVATE_KEY secret is not set" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Running ssh-keyscan against ${{ secrets.SSH_HOST }}..."
          if ! ssh-keyscan -H -T 10 "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>keyscan_err.log; then
            echo "ssh-keyscan failed:" >&2
            cat keyscan_err.log >&2
            exit 1
          fi
          echo "known_hosts populated successfully:"
          cat ~/.ssh/known_hosts

      - name: Copy image + version info to server
        run: |
          scp -i ~/.ssh/deploy_key inkukan-api.tar \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/inkukan/api/inkukan-api.tar"

          echo "IMAGE_TAG=${{ steps.version.outputs.version }}" > .env.deploy
          scp -i ~/.ssh/deploy_key .env.deploy \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/inkukan/api/.env"

      # inkukan-admin has no direct docker access (not in the docker group,
      # no general sudo rights) - these are the same "docker load" /
      # "docker compose up -d" commands, just run as root via the one
      # whitelisted script so the deploy user stays locked down.
      - name: Load image and restart the stack
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "sudo /usr/local/bin/app-deploy.sh load inkukan-api.tar && sudo /usr/local/bin/app-deploy.sh up"
