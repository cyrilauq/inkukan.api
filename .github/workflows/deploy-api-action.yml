name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Get version number from the csproj under src/Inkukan.api ---
      - name: Extract version from csproj
        id: version
        run: |
          echo "Repo root contents:"
          ls -la

          echo "Looking for src/ folder (case-insensitive):"
          find . -maxdepth 2 -iname "src" -type d

          echo "Searching whole repo for Inkukan.api csproj:"
          CSPROJ=$(find . -iname "*.csproj" -ipath "*inkukan.api*" | head -n1)

          if [ -z "$CSPROJ" ]; then
            echo "No matching .csproj found anywhere in the repo." >&2
            echo "All .csproj files found instead:" >&2
            find . -iname "*.csproj" >&2
            exit 1
          fi

          echo "Using csproj: $CSPROJ"

          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" "$CSPROJ" || true)
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -oPm1 "(?<=<VersionPrefix>)[^<]+" "$CSPROJ" || true)
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0-${GITHUB_SHA::7}"
            echo "No <Version>/<VersionPrefix> tag found, falling back to $VERSION"
          fi

          # --- Validate before it ever gets used as a Docker tag or in a shell command ---
          # Docker tags: letters, digits, underscore, period, dash only (keep it tight on purpose).
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9]([A-Za-z0-9._-]{0,127})$ ]]; then
            echo "Extracted version '$VERSION' is not a safe/valid Docker tag. Refusing to continue." >&2
            exit 1
          fi

          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # --- Build the image locally on the runner (no registry) ---
      - name: Build image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build \
            -t "cyrilauq/inkukan-api:$VERSION" \
            -t "cyrilauq/inkukan-api:latest" \
            .

      - name: Save image as tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker save -o inkukan-api.tar \
            "cyrilauq/inkukan-api:$VERSION" \
            "cyrilauq/inkukan-api:latest"

      # --- Ship it to the VPS ---
      - name: Set up SSH key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Pinned host key(s) for SSH_HOST, in known_hosts format.
          # Obtain this ONCE via a trusted channel (e.g. run `ssh-keyscan -H your.host`
          # from a machine you trust, or read /etc/ssh/ssh_host_*_key.pub on the VPS
          # itself) and store the resulting line(s) as this secret.
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "SSH_HOST secret is not set" >&2
            exit 1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "SSH_USER secret is not set" >&2
            exit 1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "SSH_PRIVATE_KEY secret is not set" >&2
            exit 1
          fi
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "SSH_KNOWN_HOSTS secret is not set. Refusing to trust an unverified host key." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Use the pinned host key(s) instead of trusting whatever ssh-keyscan returns.
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "known_hosts populated from pinned secret."

      - name: DEBUG known_hosts (remove after fixing)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "SSH_HOST value length: ${#SSH_HOST}"
          echo "SSH_HOST (raw): [$SSH_HOST]"
          echo "--- known_hosts content ---"
          cat ~/.ssh/known_hosts
          echo "--- line count ---"
          wc -l ~/.ssh/known_hosts
          echo "--- live host key offered by server right now ---"
          ssh-keyscan -t ed25519,rsa,ecdsa -H "$SSH_HOST" 2>&1 || true

      - name: Copy image + version info to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scp -i ~/.ssh/deploy_key inkukan-api.tar \
            "$SSH_USER@$SSH_HOST:/opt/inkukan/inkukan-api.tar"

          echo "IMAGE_TAG=$VERSION" > .env.deploy
          scp -i ~/.ssh/deploy_key .env.deploy \
            "$SSH_USER@$SSH_HOST:/opt/inkukan/.env"

      # inkukan-admin has no direct docker access (not in the docker group,
      # no general sudo rights) - these are the same "docker load" /
      # "docker compose up -d" commands, just run as root via the one
      # whitelisted script so the deploy user stays locked down.
      - name: Deploy app
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "sudo /usr/local/bin/app-deploy.sh load inkukan-api.tar"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "sudo /usr/local/bin/app-deploy.sh up"
